<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejer-04</title>
    <script src="https://kit.fontawesome.com/e87d10dd99.js" crossorigin="anonymous"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        #container {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            border: 5px solid gray;
            width: 80%;
            margin: 4rem auto;
            padding: 2rem;
        }

        header {
            text-align: center;
            font-size: 2rem;
            text-decoration: underline 5px solid black;
            margin-bottom: 2rem;
            display: none;
        }

        #pantalla {
            width: 80%;
            margin: 1rem auto;
            height: 500px;
            background-color: black;
            position: relative;
        }

        #objeto {
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            transition: all linear 0.3s;
            border-radius: 0;
        }

        #gamepad,
        #distancia {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #gamepad {
            margin-bottom: 2rem;
        }

        .flechas {
            width: 50px;
            height: 50px;
            font-size: 2rem;
            text-align: center;
        }

        .flx_leftup {
            rotate: 45deg;
        }

        .flx_rightup {
            rotate: 135deg;
        }

        .flx_rightdown {
            rotate: -140deg;
        }

        .flx_leftdown {
            rotate: -45deg;
        }

        .flt {
            color: rgb(255, 255, 255, 0);
        }

        #contador_distancia {
            text-align: center;
            width: 2%;
        }

        /*CLASES DE POSICION DEL OBJETO*/
        .obj_lu {
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            left: 0;
            top: 0;
            transition: all linear 0.3s;
            border-radius: 0;
        }

        .obj_ru {
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            left: calc(100% - 100px);
            top: 0;
            transition: all linear 0.3s;
            border-radius: 0;
        }

        .obj_ld {
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            left: 0;
            top: calc(100% - 100px);
            transition: all linear 0.3s;
            border-radius: 0;
        }

        .obj_rd {
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            left: calc(100% - 100px);
            top: calc(100% - 100px);
            transition: all linear 0.3s;
            border-radius: 0;
        }

        .obj_centro {
            width: 100px;
            height: 100px;
            background-color: red;
            position: absolute;
            left: calc(50% - 50px);
            top: calc(50% - 50px);
            transition: all linear 0.3s;
            border-radius: 0;
        }
    </style>
</head>

<body>
    <div id="container">
        <header>
            <h1>Movimiento de Elemento</h1>
        </header>
        <main>
            <div id="controles">
                <div id="gamepad">

                    <div class="padsuperior">
                        <button id="btn_leftup" class="flechas"><span
                                class="fa-solid fa-left-long flx_leftup"></span></button>
                        <button id="up" class="flechas"><span class="fa-solid fa-arrow-up flt"></span></button>
                        <button id="btn_rightup" class="flechas"><span
                                class="fa-solid fa-left-long flx_rightup"></span></button>
                    </div>

                    <div class="padcentral">
                        <button id="izq" class="flechas"><span class="fa-solid fa-arrow-left flt"></span></button>
                        <button id="centro" class="flechas"><span class="fa-solid fa-circle"></span></button>
                        <button id="dcha" class="flechas"><span class="fa-solid fa-arrow-right flt"></span></button>
                    </div>

                    <div class="padinferior">
                        <button id="btn_leftdown" class="flechas"><span
                                class="fa-solid fa-left-long flx_leftdown"></span></button>
                        <button id="abajo" class="flechas"><span class="fa-solid fa-arrow-down flt"></span></button>
                        <button id="btn_rightdown" class="flechas"><span
                                class="fa-solid fa-left-long flx_rightdown"></span></button>
                    </div>
                </div>

                <div id="distancia">
                    <label for="barra_distancia"><strong>Velocidad: </strong></label>
                    <input type="range" min="0" max="200" step="10" id="barra_distancia">
                    <input type="text" id="contador_distancia" disabled>
                </div>

            </div>

            <div id="pantalla">
                <div id="objeto"></div>
            </div>
        </main>
    </div>

        const elemento = document.getElementById('objeto');

        function leftUp() {
            elemento.className = 'obj_lu';
        }
        function rightUp() {
            elemento.className = 'obj_ru';
        }
        function leftDown() {
            elemento.className = 'obj_ld'
        }
        function rightDown() {
            elemento.className = 'obj_rd'
        }
        function movCentro() {
            elemento.className = 'obj_centro'
        }

        document.getElementById('btn_leftup').onmouseover = leftUp;
        document.getElementById('btn_rightup').onmouseover = rightUp;
        document.getElementById('btn_leftdown').onmouseover = leftDown;
        document.getElementById('btn_rightdown').onmouseover = rightDown;
        document.getElementById('centro').onmouseover = movCentro;

</body>
