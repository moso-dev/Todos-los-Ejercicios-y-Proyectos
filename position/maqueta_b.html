<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maqueta B</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 1200px;
            height: 600px;
            margin: auto;
            margin-top: 5rem;
        }

        #cabecera2 {
            width: 580px;
            height: 140px;
        }

        header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
        }
        .cabecera {
            width: 300px;
            height: 140px;
            background-color: #5a8191;
            border: 2px solid black;
        }

        .fila {
            width: 1200px;
            height: 150px;
            border: 2px solid black;
            margin-bottom: 1rem;
        }
        #fila1 {
            background-color: #92e9f4;
        }
        #fila2 {
            background-color: #5a8191;
        }

        footer {
            display: flex;
            justify-content: space-between;
        }

        .boxpie {
            width: 285px;
            height: 100px;
            background-color: #92e9f4;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="cabecera" id="cabecera1"></div>
            <div class="cabecera" id="cabecera2"></div>
            <div class="cabecera" id="cabecera3"></div>
        </header>
        <main>
            <div class="fila" id="fila1"></div>
            <div class="fila" id="fila2"></div>
        </main>
        <footer>
            <div class="boxpie"></div>
            <div class="boxpie"></div>
            <div class="boxpie"></div>
            <div class="boxpie"></div>
        </footer>
    </div>
</body>
</html>
