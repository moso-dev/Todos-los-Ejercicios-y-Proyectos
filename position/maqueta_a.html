<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Maqueta A</title>
    <style>
        *{
            margin: 0rem;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 1200px;
            height: 600px;
            margin: auto;
            margin-top: 5rem;
        }
        
        main {
            display: flex;
            justify-content: space-between;
        }
        .cabecera {
            width: 1200px;
            height: 120px;
            background-color: #5b8fb1;
            border: 2px solid black;
            margin-bottom: 1rem;
        }
        .columnas {
            width: 390px;
            height: 320px;
            background-color: #416780;
            border: 2px solid black;
            margin-bottom: 1rem;
        }
        .pie1 {
            width: 1200px;
            height: 60px;
            background-color: #5b8fb1;
            border: 2px solid black;
            margin-bottom: 1rem;
        }
        .cajapie2 {
            display: flex;
            gap: 20px;
        }
        
        .pie2 {
            width: 590px;
            height: 60px;
            background-color: #416780;
            border: 2px solid black;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="cabecera"></div>
        </header>
        <main>
            <section class="columnas"></section>
            <section class="columnas"></section>
            <section class="columnas"></section>
        </main>
        <footer>
            <div class="pie1"></div>
            <div class="cajapie2">
                <div class="pie2"></div>
                <div class="pie2"></div>
            </div>
        </footer>
    </div>
</body>
</html>
