<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>15-Ejerc.</title>
    <script src="https://kit.fontawesome.com/e87d10dd99.js" crossorigin="anonymous"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&family=Goblin+One&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        body {
            font-family: "Dosis", sans-serif;
            font-weight: 800;
        }

        nav {
            margin: auto;
            display: flex;
            justify-content: center;
        }

        ul {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        a {
            text-decoration: none;
            color: purple;
            display: block;
            padding: 0.5rem;
            border: 2px solid purple;
            border-radius: 2rem;
            transition: all 0.2s ease;
        }

        a:hover {
            color: #0996ab;
            border: 2px solid #0996ab;
            border-radius: 2rem;
            transform: scale(1.04);
            text-shadow: 1.5px 0.5px 2.5px gray;
        }
    </style>
</head>

<body>
    <div class="container">
        <header></header>
        <main>
            <nav>
                <ul>
                    <li><a href="#"><i class="fa-solid fa-location-dot"></i> LOCALIZACIÓN</a></li>
                    <li><a href="#"><i class="fa-solid fa-comment-dots"></i> CONTACTO</a></li>
                    <li><a href="#"><i class="fa-solid fa-euro-sign"></i> PASALERA</a></li>
                    <li><a href="#"><i class="fa-solid fa-cart-shopping"></i> CARRITO</a></li>
                </ul>
            </nav>
        </main>
        <footer></footer>
    </div>
</body>

</html>
