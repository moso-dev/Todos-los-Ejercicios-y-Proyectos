<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1rº Transicion</title>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&family=Goblin+One&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rock+Salt&display=swap');
        @import url('https://fonts.googleapis.com/css2?family=Dosis:wght@200..800&family=Goblin+One&family=Londrina+Sketch&family=Montserrat+Alternates:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Rock+Salt&display=swap');


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #9acd32;
        }

        h1 {
            font-family: "Rock Salt", cursive;
            font-weight: 400;
            font-style: normal;
            color: #ff00ff;
            text-align: center;
            text-shadow: 2px 2px 2px #8C377A;
            transition: all 0.5s ease;
            font-size: 5rem;
        }
        
        h1:hover {
            color: #8C377A;
            text-shadow: 2px 2px 8px #ff00ff;
        }

        img {
            max-width: 60%;
            height: auto;
            margin: 0 20%;
            display: block;
            transition: all 0.4s ease;
        }

        h3 {
            color: #90EE90;
            font-size: 4rem;
            font-family: "Londrina Sketch", sans-serif;
            font-weight: 999;
            font-style: normal;
            position: absolute;
            top: calc(50% - 57px);
            left: 100%;
            transition: all 0.4s ease 0.35s;
            z-index: 2;
        }

        article:hover h3 {
            left: 49%;
            transform: rotate(-90deg);
        }

        .discos {
            display: flex;
            width: 85%;
            margin: auto;
            gap: 2rem;
        }

        article {
            border: 3px solid #008000;
            position: relative;
            overflow: hidden;
        }

        .pantalla {
            width: 40%;
            height: 100%;
            background-color: rgba(0, 128, 0, 0.5);
            position: absolute;
            top: 100%;
            right: 0;
            transition: all 1s ease 0.3s;
            z-index: 1;
        }

        article:hover .pantalla {
            transform: translateY(-100%);
        }

        article:hover img {
            margin: 0;
        }
    </style>
</head>

<body>
    <div class="container">
        <header>
            <h1>1977. El año del punk-rock</h1>
        </header>
        <main>
            <section class="discos">
                <article>
                    <img src="imgs/nevermind-pistols.jpg" alt="nevermind disco">
                    <h3>Sex Pistols</h3>
                    <div class="pantalla"></div>
                </article>

                <article>
                    <img src="imgs/ramones-rocket.jpg" alt="ramones disco">
                    <h3>Ramones</h3>
                    <div class="pantalla"></div>
                </article>
            </section>
        </main>
        <footer></footer>
    </div>
</body>

</html>
